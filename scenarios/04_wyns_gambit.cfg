[scenario]
	id=04_wyns_gambit
	name = _ "Wyn's Gambit"
	map_data="{~add-ons/Order_of_Oerbrae/maps/04_wyns_gambit.map}"
	next_scenario=04_dal_ardhoen
	random_start_time=no
	turns=10
	allow_new_game=yes
	force_lock_settings=yes
	victory_when_enemies_defeated=no

	{DEFAULT_MUSIC_PLAYLIST}

	{DAWN}
	{MORNING}
	{MORNING}
	{MORNING}
	{MORNING}
	{AFTERNOON}
	{AFTERNOON}
	{AFTERNOON}
	{AFTERNOON}
	{DUSK}
	{FIRST_WATCH}
	{FIRST_WATCH}
	{FIRST_WATCH}
	{FIRST_WATCH}
	{SECOND_WATCH}
	{SECOND_WATCH}
	{SECOND_WATCH}
	{SECOND_WATCH}

	# Objectives
	[event]
		name=prestart
		[objectives]
			side=0
			[objective]
				description= _ "Aowyn and Leaka must reach the fort at 14,4"
				condition=win
			[/objective]
			{OBJ_DEATH_PLAYERS}
			{OBJ_TURNS}
			note= _ "Time is different in this scenario. Daytime and nightime will be 8 turns each, with one turn of dusk or dawn between them.

Aowyn and Laeka must be together at the fort at 14,4 by the end of turn 10."
		[/objectives]
	[/event]

#ifdef MULTIPLAYER
	{AOWYN_SIDE 1 (
		{GOLD 50 40 30}
		color="blue"
	)}
#else
	{AOWYN_SIDE 1 (
		{GOLD 100 80 60}
	)}
#endif

	{LAEKA_SIDE 2 (
		{GOLD 50 40 30}
		color="red"
	)}

	{AI_SIDE "Bat" "Creatures Leader" 3 (
		canrecruit=no
		team_name=creatures
		user_team_name = _ "Creatures"
    name = _ ""
		hidden=yes
	)}

	{AI_SIDE "ARDN Nightmare" "Fanna-tëthea" 4 (
		gender=female
		canrecruit=no
		team_name=The Black Shídhe
		user_team_name = _ "Fanna-tëthea"
		hidden=yes
		[modifications]
			{TRAIT_FEARLESS}
			{TRAIT_STRONG}
		[/modifications]
	)}

	# Player death events
	{DEATH_PLAYERS}

	# DEV ONLY: assign recruits
	[event]
		name=prestart
		[allow_recruit]
			type=ARDN Ruffian,ARDN Scrapper,ARDN Scout,ARDN Cleric
			side=1,2
		[/allow_recruit]
		{NAMED_UNIT 1 "ARDN Outcast" 23 23 Laeka ( _ "Laeka") (
			name= _ "Laeka"
			animate=yes
			gender=female
			canrecruit=yes
			[modifications]
				{TRAIT_FEARLESS}
				{TRAIT_QUICK}
			[/modifications]
		)}
		{MAKE_LOYAL_LEADER Laeka}
		{NAMED_UNIT 1 "ARDN Bondholder" 20 20 Mór ( _ "Mór") (
			profile=portraits/mor.png
		)}
		{NAMED_UNIT 1 "ARDN Stalker" 21 21 Cánë-ramian ( _ "Cánë-ramian") ()}
		[unit]
			type=ARDN Ruffian
			side=1
			experience=24
			x,y=recall,recall
		[/unit]
		[unit]
			type=ARDN Roughneck
			side=1
			x,y=recall,recall
		[/unit]
		[unit]
			type=ARDN Scrapper
			side=1
			experience=10
			x,y=recall,recall
		[/unit]
		[unit]
			type=ARDN Brawler
			side=1
			x,y=recall,recall
		[/unit]
		[unit]
			type=ARDN Scout
			side=1
			experience=16
			x,y=recall,recall
		[/unit]
	[/event]

	# AI setup
	[event]
		name=prestart
		[micro_ai]
			side=3
			ai_type=wolves
			action=add
			[filter]
				type=Vampire Bat, Blood Bat
			[/filter]
			[filter_second]
				side=1,2
			[/filter_second]
		[/micro_ai]
		[micro_ai]
			side=3
			ai_type=big_animals
			action=add
			[filter]
				type=Wolf
			[/filter]
			[filter_second]
				side=1,2
			[/filter_second]
		[/micro_ai]
	[/event]

	[event]
		name=start
		[recall]
			id=Laeka
		[/recall]
		[recall]
			id=Mór
		[/recall]
		[recall]
			id=Cánë-ramian
		[/recall]
		[store_unit]
			[filter]
				id=Fanna-tëthea
			[/filter]
			variable=enemy_leader
			kill=yes
			animate=no
		[/store_unit]
		[message]
			speaker=Cánë-ramian
			message = _ "Here's the plan..."
		[/message]
		[message]
			speaker=Mór
			message = _ "Aye!"
		[/message]
		[store_unit]
			[filter]
				id=Mór,Cánë-ramian
			[/filter]
			variable=reinforcements
			kill=yes
			animate=no
		[/store_unit]
		[message]
			speaker=Aowyn
			message = _ "Ok here we go."
		[/message]
		{HIGHLIGHT_IMAGE 14 4 items/gohere.png ()}
	[/event]

	[event]
		name=moveto
		first_time_only=no
		[filter]
			id=Aowyn,Laeka
			[filter_location]
				x=14
				y=4
				radius=1
			[/filter_location]
		[/filter]
		[if]
			[have_unit]
				id=Aowyn
				[filter_location]
					x=14
					y=4
					radius=1
				[/filter_location]
			[/have_unit]
			[and]
				[have_unit]
					id=Laeka
					[filter_location]
						x=14
						y=4
						radius=1
					[/filter_location]
				[/have_unit]
			[/and]
			[then]
				[fire_event]
					name=reached_stronghold
				[/fire_event]
			[/then]
		[/if]
	[/event]

	[event]
		name=reached_stronghold
		{REMOVE_IMAGE 14 4}
		[message]
			speaker=Laeka
			message = _ "Let's prepare for nightfall."
		[/message]
		[modify_turns]
			value=19
		[/modify_turns]
		[objectives]
			side=0
			[objective]
				description= _ "Survive the night"
				condition=win
			[/objective]
			[objective]
				{ALTERNATIVE_OBJECTIVE_CAPTION}
				description= _ "Kill Fanna-tëthea"
				condition=win
			[/objective]
			{OBJ_DEATH_PLAYERS}
			note= _ "Dawn will break on turn 19 and your reinforcements will emerge from hiding in the south."
		[/objectives]
	[/event]

	[event]
		name=turn 11
		[message]
			speaker=Aowyn
			message = _ "Here we go"
		[/message]
		[unstore_unit]
			variable=enemy_leader
			x,y=2,12
			animate=no
		[/unstore_unit]
		{UNIT 4 "ARDN Stalker" 2 11 (id=guard_1)}
		{UNIT 4 "ARDN Stalker" 3 13 (id=guard_2)}
		{UNIT 4 "ARDN Stalker" 3 12 (id=guard_3)}
		[micro_ai]
			side=4
			ai_type=goto
			action=add
			avoid_enemies=2
			[filter]
				id=Fanna-tëthea,guard_1,guard_2,guard_3
			[/filter]
			[filter_location]
				x,y=17,14
			[/filter_location]
		[/micro_ai]
		{UNIT 4 "ARDN Stalker" 7 12 ()}
		{UNIT 4 "ARDN Stalker" 2 3 ()}
		{UNIT 4 "ARDN Stalker" 25 18 ()}
		{UNIT 4 "ARDN Stalker" 10 18 ()}
		{UNIT 4 "ARDN Stalker" 4 17 ()}
	[/event]

	[event]
		name=turn 17
		{UNIT 4 "ARDN Stalker" 7 12 ()}
		{UNIT 4 "ARDN Stalker" 7 15 ()}
		{UNIT 4 "ARDN Stalker" 2 3 ()}
		{UNIT 4 "ARDN Stalker" 25 18 ()}
		{UNIT 4 "ARDN Stalker" 10 18 ()}
		{UNIT 4 "ARDN Stalker" 19 11 ()}
		{UNIT 4 "ARDN Stalker" 4 17 ()}
	[/event]

	[event]
		name=moveto
		[filter]
			id=Fanna-tëthea
			x,y=17,14
			radius=1
		[/filter]
		[micro_ai]
			side=4
			ai_type=goto
			action=delete
		[/micro_ai]
		[micro_ai]
			side=4
			ai_type=hunter
			action=add
			id=Fanna-tëthea,guard_1,guard_2,guard_3
			home_x,home_y=17,14
			rest_turns=1
			[filter_location]
				x,y=13-17,14-16
			[/filter_location]
			# TEMP DEBUG. REMOVE
			show_mesages=yes
		[/micro_ai]
	[/event]

	[event]
		name=turn 19
		{VARIABLE enemy_fleeing yes}
		[micro_ai]
			side=4
			ai_type=hunter
			action=delete
		[/micro_ai]
		[micro_ai]
			side=4
			ai_type=messenger_escort
			action=add
			id=Fanna-tëthea
			waypoint_x=11
			waypoint_y=26
			[avoid]
				x,y=14,4
				radius=6
			[/avoid]
		[/micro_ai]
		[message]
			speaker=Laeka
			message = _ "Dawn has arrived."
		[/message]
		[unstore_unit]
			variable=reinforcements
			x,y=23,22
			animate=yes
		[/unstore_unit]
		[message]
			speaker=Mór
			message = _ "Don't let him escape!"
		[/message]
		[message]
			speaker=narrator
			message = _ "<span style='italic'>The scenario will be lost if the Fanna-tëthea is able to cross the bridge in the south.</span>"
		[/message]
		{HIGHLIGHT_IMAGE 11 26 items/gohere.png ()}
		{REMOVE_IMAGE 11 26}
		[modify_turns]
			value=32
		[/modify_turns]
		[objectives]
			side=0
			[objective]
				description= _ "Kill Fanna-tëthea before they escape"
				condition=win
			[/objective]
			{OBJ_DEATH_PLAYERS}
			{OBJ_DEATH_MOR ()}
			note= _ "The scenario will be lost if Fanna-tëthea reaches the bridge in the south at 11,26."
		[/objectives]
		{DEATH_MOR (
			[endlevel]
				result=defeat
			[/endlevel]
		)}
	[/event]

	[event]
		name=moveto
		first_time_only=no
		[filter]
			id=Fanna-tëthea
			x,y=11,26
		[/filter]
		[if]
			[variable]
				name=enemy_fleeing
				equals=yes
			[/variable]
			[then]
				[message]
					speaker=narrator
					message = _ "He escaped."
				[/message]
				[endlevel]
					result=defeat
				[/endlevel]
			[/then]
		[/if]
	[/event]

	[event]
		name=die
		[filter]
			id=Fanna-tëthea
		[/filter]
		[message]
			speaker=narrator
			message = _ "Win!"
		[/message]
		{CLEAR_VARIABLE reinforcements}
		{CLEAR_VARIABLE enemy_fleeing}
		[endlevel]
			carryover_percentage=40
			carryover_add=yes
			result=victory
		[/endlevel]
	[/event]

[/scenario]