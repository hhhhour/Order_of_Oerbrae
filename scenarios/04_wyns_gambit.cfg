[scenario]
	id=04_wyns_gambit
	name = _ "Wyn's Gambit"
	map_data="{~add-ons/Order_of_Oerbrae/maps/04_wyns_gambit.map}"
	next_scenario=04_dal_ardhoen
	random_start_time=no
	turns=23
	allow_new_game=yes
	force_lock_settings=yes
	victory_when_enemies_defeated=no

	{DEFAULT_MUSIC_PLAYLIST}

	{DAWN}
	{MORNING}
	{MORNING}
	{MORNING}
	{MORNING}
	{MORNING}
	{AFTERNOON}
	{AFTERNOON}
	{AFTERNOON}
	{AFTERNOON}
	{AFTERNOON}
	{DUSK}
	{FIRST_WATCH}
	{FIRST_WATCH}
	{FIRST_WATCH}
	{FIRST_WATCH}
	{FIRST_WATCH}
	{SECOND_WATCH}
	{SECOND_WATCH}
	{SECOND_WATCH}
	{SECOND_WATCH}
	{SECOND_WATCH}

	# Objectives
	[event]
		name=prestart
		[objectives]
			side=0
			[objective]
				description= _ "Survive the night (22 turns)"
				condition=win
			[/objective]
			[objective]
				description= _ "Aowyn and Laeka should reach the fort in the north before dusk (11 turns)"
				red=255
				green=255
				blue=255
				condition=win
			[/objective]
			{OBJ_DEATH_PLAYERS}
			{OBJ_TURNS}
			note= _ "Time is different in this scenario. Daytime and nightime will be 10 turns each, with one turn of dusk or dawn between them."
		[/objectives]
	[/event]

#ifdef MULTIPLAYER
	{AOWYN_SIDE 1 (
		{GOLD 45 35 25}
		color="blue"
	)}
#else
	{AOWYN_SIDE 1 (
		{GOLD 90 70 50}
	)}
#endif

	{LAEKA_SIDE 2 (
		{GOLD 45 35 25}
		color="red"
	)}

	{AI_SIDE "Bat" "Creatures Leader" 3 (
		canrecruit=no
		team_name=creatures
		user_team_name = _ "Creatures"
    name = _ ""
		hidden=yes
	)}

	{AI_SIDE "ARDN Nightmare" "Fanna-tëthea" 4 (
		gender=female
		canrecruit=no
		team_name=The Black Shídhe
		user_team_name = _ "Fanna-tëthea"
		hidden=yes
		[modifications]
			{TRAIT_FEARLESS}
			{TRAIT_STRONG}
		[/modifications]
		[ai]
			aggression=0.8
			leader_ignores_keep=yes
			leader_aggression=-1
		[/ai]
		# prevent enemey units from lingering on nearby
		# cliffs instead of joining the battle
		[avoid]
			x=6-8,11-12,20-21
			y=2-5,19-24,15-16
		[/avoid]
	)}

	# Player death events
	{DEATH_PLAYERS}

	# Pre-start and multiplayer setup
	# ----
	# - Recalls
	# - Second keep in MP
	[event]
		name=prestart
		[recall]
			id=Laeka
		[/recall]
		[recall]
			id=Mór
		[/recall]
		[recall]
			id=Cánë-ramian
		[/recall]
		[store_unit]
			[filter]
				id=Fanna-tëthea
			[/filter]
			variable=enemy_leader
			kill=yes
			animate=no
		[/store_unit]
#ifdef MULTIPLAYER
		[terrain]
			x,y=26,24
			layer=both
			terrain=Kea
		[/terrain]
		[terrain]
			x,y=27,25
			layer=both
			terrain=Ce
		[/terrain]
#endif
	[/event]

	# DEV ONLY: assign recruits
	[event]
		name=prestart
		[allow_recruit]
			type=ARDN Ruffian,ARDN Scrapper,ARDN Scout,ARDN Cleric
			side=1,2
		[/allow_recruit]
		{NAMED_UNIT 1 "ARDN Outcast" 26 24 Laeka ( _ "Laeka") (
			name= _ "Laeka"
			animate=yes
			gender=female
			canrecruit=yes
			[modifications]
				{TRAIT_FEARLESS}
				{TRAIT_QUICK}
			[/modifications]
		)}
		{MAKE_LOYAL_LEADER Laeka}
		{NAMED_UNIT 1 "ARDN Bondholder" 25 24 Mór ( _ "Mór") (
			profile=portraits/mor.png
		)}
		{NAMED_UNIT 1 "ARDN Stalker" 25 25 Cánë-ramian ( _ "Cánë-ramian") ()}
	[/event]

	# Creatures setup
	[event]
		name=prestart
		{VARIABLE wolves_north_count 1}
		{VARIABLE wolves_center_count 1}
#ifndef NORMAL
		{VARIABLE wolves_center_count 2}
#endif
#ifndef HARD
		{VARIABLE wolves_north_count 2}
#endif
		{OOO_PLACE_HUNTERS "wolves_north" $wolves_north_count (
			x,y=11-17,4-9
			terrain=*^F*
		) (
			type=Wolf
			side=3
		)}
		{OOO_PLACE_HUNTERS "wolves_center" $wolves_center_count (
			x,y=11-17,10-15
			terrain=*^F*
		) (
			type=Wolf
			side=3
		)}
		{CLEAR_VARIABLE wolves_north_count}
		{CLEAR_VARIABLE wolves_center_count}
		[micro_ai]
			side=3
			ai_type=wolves
			action=add
			[filter]
				type=Vampire Bat,Blood Bat
			[/filter]
			[filter_second]
				side=1,2
			[/filter_second]
		[/micro_ai]
	[/event]

	# Start dialogue
	[event]
		name=start
		[message]
			speaker=Cánë-ramian
			message = _ "Here's the plan..."
		[/message]
		[message]
			speaker=Mór
			message = _ "Aye!"
		[/message]
		[store_unit]
			[filter]
				id=Mór,Cánë-ramian
			[/filter]
			variable=reinforcements_heroes
			kill=yes
			animate=no
		[/store_unit]
		[set_variable]
			name=reinforcements_count
#ifdef EASY
			value=4
#endif
#ifdef NORMAL
			value=3
#endif
#ifdef HARD
			value=2
#endif
		[/set_variable]
		{OOO_STORE_TOP_RECALLS $reinforcements_count reinforcements}
		{CLEAR_VARIABLE reinforcements_count}
		[message]
			speaker=Aowyn
			message = _ "Ok here we go."
		[/message]
		{HIGHLIGHT_IMAGE 14 4 items/gohere.png ()}
	[/event]

	# Spawn bats
	[event]
		name=moveto
		[filter]
			side=1,2
			[filter_location]
				x,y=14,11
				radius=3
			[/filter_location]
		[/filter]
		{VARIABLE bat_type "Vampire Bat"}
#ifndef EASY
		{VARIABLE bat_type "Blood Bat"}
#endif
		[scroll_to]
			x,y=14,11
		[/scroll_to]
		{OOO_SPAWN_BAT $bat_type 13 12}
		{OOO_SPAWN_BAT $bat_type 15 12}
#ifndef EASY
		{OOO_SPAWN_BAT $bat_type 14 12}
#endif
#ifdef HARD
		{OOO_SPAWN_BAT "Blood Bat" 14 11}
#endif
		{CLEAR_VARIABLE bat_type}
	[/event]

	# Warning to reach fort
	[event]
		name=turn 10
		[if]
			[variable]
				name=reached_stronghold
				boolean_equals=false
			[/variable]
			[then]
				[message]
					name=Aowyn
					message = _ "Let's hurry to the fort. We don't want to be trapped outside the walls when night falls."
				[/message]
			[/then]
		[/if]
	[/event]

	# Reach fort
	[event]
		name=moveto
		first_time_only=no
		[filter]
			id=Aowyn,Laeka
			[filter_location]
				x=14
				y=4
				radius=1
			[/filter_location]
		[/filter]
		[if]
			[have_unit]
				id=Aowyn
				[filter_location]
					x=14
					y=4
					radius=1
				[/filter_location]
			[/have_unit]
			[and]
				[have_unit]
					id=Laeka
					[filter_location]
						x=14
						y=4
						radius=1
					[/filter_location]
				[/have_unit]
			[/and]
			[then]
				[fire_event]
					name=reached_stronghold
				[/fire_event]
			[/then]
		[/if]
	[/event]

	[event]
		name=reached_stronghold
		{REMOVE_IMAGE 14 4}
		[message]
			speaker=Laeka
			message = _ "Let's prepare for nightfall."
		[/message]
		[modify_turns]
			value=23
		[/modify_turns]
		[objectives]
			side=0
			[objective]
				description= _ "Survive the night (22 turns)"
				condition=win
			[/objective]
			[objective]
				{ALTERNATIVE_OBJECTIVE_CAPTION}
				description= _ "Kill Fanna-tëthea"
				condition=win
			[/objective]
			{OBJ_DEATH_PLAYERS}
			note= _ "Dawn will break on turn 19 and your reinforcements will emerge from hiding in the south."
		[/objectives]
		{VARIABLE stronghold_reached yes}
	[/event]

	# Dusk arrives
	# ----
	# Signal fires lit if the stronghold is reached
	[event]
		name=turn 12
		[if]
			[variable]
				name=stronghold_reached
				boolean_equals=yes
			[/variable]
			[then]
				[message]
					speaker=Laeka
					message = _ "Night will be here soon and with it Fanna-tëthea. Light the signal flares!"
				[/message]
				{OOO_LIGHT_BRAZIER (x,y=8,7)}
				{OOO_LIGHT_BRAZIER (x,y=11,10)}
				{OOO_LIGHT_BRAZIER (x,y=16,10)}
				{OOO_LIGHT_BRAZIER (x,y=19,8)}
				{VARIABLE fires_lit 0}
				[objectives]
					side=0
					[objective]
						description= _ "Survive the night (turn 23)"
						condition=win
					[/objective]
					[objective]
						{ALTERNATIVE_OBJECTIVE_CAPTION}
						description= _ "Kill Fanna-tëthea"
						condition=win
					[/objective]
					{OBJ_DEATH_PLAYERS}
					note= _ "Dawn will break on turn 23 and your reinforcements will emerge from hiding in the south."
				[/objectives]
				[event]
					name=moveto
					first_time_only=no
					[filter]
						side=4
						[filter_location]
							terrain=Rb^Ebn
						[/filter_location]
					[/filter]
					[scroll_to]
						x=$unit.x
						y=$unit.y
					[/scroll_to]
					[sound]
						name=torch-miss.ogg
					[/sound]
					[terrain]
						x=$unit.x
						y=$unit.y
						terrain=Rb^Eb
					[/terrain]
					[redraw][/redraw]
					[delay]
						time=600
					[/delay]
					{OOO_IF_FIRE_EXTINGUISHED 0 (
						[message]
							speaker=Laeka
							message = _ "Here they come!"
						[/message]
					)}
					{OOO_IF_FIRE_EXTINGUISHED 1 (
						[message]
							speaker=Laeka
							message = _ "Second one down!"
						[/message]
					)}
					{OOO_IF_FIRE_EXTINGUISHED 2 (
						[message]
							speaker=Laeka
							message = _ "More are arriving!"
						[/message]
					)}
					{OOO_IF_FIRE_EXTINGUISHED 3 (
						[message]
							speaker=Laeka
							message = _ "That's the last of them. Just the darkness surrounds us now."
						[/message]
					)}
					[set_variable]
						name=fires_lit
						add=1
					[/set_variable]
				[/event]
			[/then]
			[else]
				[message]
					speaker=Laeka
					message = _ "Night is almost here! We should ready our defenses."
				[/message]
			[/else]
		[/if]
		{CLEAR_VARIABLE stronghold_reached}
	[/event]

	# Night arrives
	# ----
	# Spawn enemy units and configure micro AIs
	# - Enemy moves to center with guards
	# - Some enemy units move to extinguish the fires
	# - Two waves of reinforcements during the night, one right
	#   before dawn to make the final phase more difficult.
	[event]
		name=turn 13
		[message]
			speaker=Aowyn
			message = _ "Here we go"
		[/message]
		[unstore_unit]
			variable=enemy_leader
			x,y=2,12
			animate=no
		[/unstore_unit]
#ifdef EASY
		{UNIT 4 "ARDN Stalker" 2 11 (id=guard_1)}
		{UNIT 4 "ARDN Stalker" 3 13 (id=guard_2)}
#endif
#ifdef NORMAL
		{UNIT 4 "ARDN Stalker" 2 11 (id=guard_1)}
		{UNIT 4 "ARDN Nightshadow" 3 13 (id=guard_2)}
#endif
#ifdef HARD
		{UNIT 4 "ARDN Nightshadow" 2 11 (id=id=guard_1)}
		{UNIT 4 "ARDN Nightshadow" 3 13 (id=guard_2)}
#endif
		{UNIT 4 "ARDN Nightshadow" 3 12 (id=guard_3)}
		[micro_ai]
			side=4
			ai_type=goto
			action=add
			avoid_enemies=2
			ca_id=goto_valley
			[filter]
				id=Fanna-tëthea,guard_1,guard_2,guard_3
			[/filter]
			[filter_location]
				x,y=17,14
			[/filter_location]
		[/micro_ai]

		# Delay arrival to first fire
		[event]
			name=turn 14
			{OOO_UNIT_GOTO_FIRE "ARDN Stalker" 2 3 8 7}
		[/event]
		{OOO_UNIT_GOTO_FIRE "ARDN Stalker" 7 12 11 10}
		{OOO_UNIT_GOTO_FIRE "ARDN Stalker" 20 11 16 10}
		{OOO_UNIT_GOTO_FIRE "ARDN Stalker" 24 15 19 8}
		{UNIT 4 "ARDN Stalker" 10 18 ()}
		{UNIT 4 "ARDN Stalker" 4 17 ()}
#ifdef EASY
		{UNIT 4 "ARDN Stalker" 21 13 ()}
#else
		{UNIT 4 "ARDN Nightshadow" 21 13 ()}
#endif
#ifdef HARD
		{UNIT 4 "ARDN Nightshadow" 3 4 ()}
#endif
	[/event]

	[event]
		name=turn 18
		{UNIT 4 "ARDN Stalker" 2 3 ()}
		{UNIT 4 "ARDN Stalker" 7 15 ()}
		{UNIT 4 "ARDN Stalker" 20 11 ()}
		{UNIT 4 "ARDN Stalker" 24 15 ()}
		{UNIT 4 "ARDN Stalker" 10 18 ()}
		{UNIT 4 "ARDN Stalker" 23 7 ()}
#ifdef EASY
		{UNIT 4 "ARDN Stalker" 21 13 ()}
#else
		{UNIT 4 "ARDN Nightshadow" 21 13 ()}
#endif
#ifdef HARD
		{UNIT 4 "ARDN Nightshadow" 5 18 ()}
#endif
	[/event]

	[event]
		name=turn 22
		{UNIT 4 "ARDN Stalker" 7 15 ()}
		{UNIT 4 "ARDN Stalker" 10 18 ()}
#ifdef EASY
		{UNIT 4 "ARDN Stalker" 21 13 ()}
#else
		{UNIT 4 "ARDN Nightshadow" 21 13 ()}
		{UNIT 4 "ARDN Stalker" 5 1 ()}
#endif
#ifdef HARD
		{UNIT 4 "ARDN Nightshadow" 5 1 ()}
		{UNIT 4 "ARDN Nightshadow" 26 7 ()}
#endif
	[/event]

	[event]
		name=moveto
		[filter]
			id=Fanna-tëthea
			[filter_location]
				x,y=17,14
				radius=3
			[/filter_location]
		[/filter]
		[micro_ai]
			side=4
			ai_type=goto
			ca_id=goto_valley
			action=delete
		[/micro_ai]
		[micro_ai]
			side=4
			ai_type=hunter
			action=add
			id=Fanna-tëthea,guard_1,guard_2,guard_3
			home_x,home_y=17,14
			rest_turns=1
			[filter_location]
				x,y=13-17,14-16
			[/filter_location]
		[/micro_ai]
	[/event]

	# Wyn illuminates
	# ----
	# - See utils/04_wyns_gambit.cfg
	{OOO_WYN_ILLUMINATES_EVENTS}
	[event]
		name=turn 13
		{VARIABLE min_army_size 9}
#ifdef NORMAL
		{VARIABLE min_army_size 7}
#endif
#ifdef HARD
		{VARIABLE min_army_size 5}
#endif
		[event]
			name=die
			first_time_only=no
			[filter]
				side=1,2
			[/filter]
			{OOO_IF_ILLUMINATED () (
				[if]
					[have_unit]
						side=1,2
						count="$(3 + $min_army_size)"
					[/have_unit]
					[then]
						[message]
							speaker=Laeka
							message = _ "They're cutting right through our lines."
						[/message]
						[if]
							[variable]
								name=turn_number
								less_than=16
							[/variable]
							[then]
								[message]
									speaker=Aowyn
									message = _ "This night has just begun. We must find a way to outlast the dark."
								[/message]
							[/then]
							[elseif]
								[variable]
									name=turn_number
									less_than=20
								[/variable]
								[then]
									[message]
										speaker=Aowyn
										message = _ "Will the light never shine again? I fear we may not make it to dawn."
									[/message]
								[/then]
							[/elseif]
							[else]
								[message]
									speaker=Aowyn
									message = _ "I feel the night is passing. Maybe we can hold out until dawn."
								[/message]
							[/else]
						[/if]
						[message]
							speaker=Laeka
							message = _ "Even the moon has abandoned us. Can you not summon some hopeful light to brighten our way?"
						[/message]
						[message]
							speaker=Aowyn
							message = _ "My father, perhaps, but it is no easy thing to brighten a darkened world."
						[/message]
						[message]
							speaker=Laeka
							message = _ "Surely, in all those books you studied, your father's journals, there is some incantation you can recall."
						[/message]
						[message]
							speaker=Aowyn
							message = _ "The power is not in the books, Leek, but in what they help me find in myself. I can no more easily learn to cast light from a book than you can learn to swing a stick from a tutor. I must still train my body to do the damned thing."
						[/message]
						# laeka receives damage
						[event]
							name=unit hits
							[filter_second]
								id=Laeka
							[/filter_second]
							{OOO_IF_ILLUMINATED (
								[event]
									name=attack end
									[message]
										speaker=Aowyn
										message = _ "Laeka!"
									[/message]
								[/event]
							) ()}
						[/event]
					[/then]
				[/if]
				[if]
					[have_unit]
						side=1,2
						count="$(1 + $min_army_size)"
					[/have_unit]
					[then]
						[message]
							speaker=Laeka
							message = _ "We are running out of time, Wyn."
						[/message]
						[message]
							speaker=Aowyn
							message = _ "They just keep coming. I don't know what to do."
						[/message]
					[/then]
				[/if]
				[if]
					[have_unit]
						side=1,2
						count=$min_army_size
					[/have_unit]
					[then]
						[fire_event]
							name=wyn_illuminates
						[/fire_event]
						{CLEAR_VARIABLE min_army_size}
					[/then]
				[/if]
			)}
		[/event]
	[/event]

	# Dawn arrives
	# ----
	# - Aowyn's illuminate finishes
	# - Reinforcements appear
	# - Enemy leader tries to flee
	[event]
		name=turn 23
		{VARIABLE enemy_fleeing yes}
		{CLEAR_VARIABLE min_army_size}
		[micro_ai]
			side=4
			ai_type=hunter
			action=delete
		[/micro_ai]
		[micro_ai]
			side=4
			ai_type=messenger_escort
			action=add
			waypoint_x=11
			waypoint_y=26
			[filter]
				id=Fanna-tëthea
			[/filter]
			[avoid]
				x,y=14,4
				radius=6
			[/avoid]
		[/micro_ai]
		[message]
			speaker=Laeka
			message = _ "Dawn has arrived."
		[/message]
		[foreach]
			array=reinforcements_heroes
			[do]
				[unstore_unit]
					variable=this_item
					x,y=26,24
					find_vacant=yes
					animate=yes
				[/unstore_unit]
			[/do]
		[/foreach]
		[foreach]
			array=reinforcements
			[do]
				[unstore_unit]
					variable=this_item
					x,y=24,24
					find_vacant=yes
					animate=yes
				[/unstore_unit]
			[/do]
		[/foreach]
		{CLEAR_VARIABLE reinforcements_heroes}
		{CLEAR_VARIABLE reinforcements}
		[message]
			speaker=Mór
			message = _ "Don't let him escape!"
		[/message]
		[message]
			speaker=narrator
			message = _ "<span style='italic'>The scenario will be lost if the Fanna-tëthea is able to cross the bridge in the south.</span>"
		[/message]
		{HIGHLIGHT_IMAGE 11 26 items/gohere.png ()}
		{REMOVE_IMAGE 11 26}
		[modify_turns]
			value=35
		[/modify_turns]
		[objectives]
			side=0
			[objective]
				description= _ "Kill Fanna-tëthea before they escape"
				condition=win
			[/objective]
			{OBJ_DEATH_PLAYERS}
			{OBJ_DEATH_MOR ()}
			{OBJ_TURNS}
			note= _ "The scenario will be lost if Fanna-tëthea reaches the bridge in the south at 11,26."
		[/objectives]
		{DEATH_MOR (
			[endlevel]
				result=defeat
			[/endlevel]
		)}
	[/event]

	# Defeat
	# ----
	# Enemy leader escapes or survives until the next night
	[event]
		name=moveto
		first_time_only=no
		[filter]
			id=Fanna-tëthea
			x,y=11,26
		[/filter]
		[if]
			[variable]
				name=enemy_fleeing
				equals=yes
			[/variable]
			[then]
				[message]
					speaker=narrator
					message = _ "She escaped."
				[/message]
				[endlevel]
					result=defeat
				[/endlevel]
			[/then]
		[/if]
	[/event]

	[event]
		name=turn 35
		[message]
			speaker=Laeka
			message = _ "Another night is upon us and Fanna-tëthea has evaded our grasp. We'll never capture them now."
