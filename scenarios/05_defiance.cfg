[scenario]
	id=05_defiance
	name = _ "Defiance"
	map_data="{~add-ons/Order_of_Oerbrae/maps/05_defiance.map}"
	next_scenario=06_hearthmor
	random_start_time=no
	turns=22
	allow_new_game=yes
	force_lock_settings=yes
	victory_when_enemies_defeated=yes

	{DEFAULT_SCHEDULE}
	{DEFAULT_MUSIC_PLAYLIST}

## Objectives

	[event]
		name=prestart
		[objectives]
			side=0
			[objective]
				description= _ "Kill Girvynr"
				condition=win
			[/objective]
			{OBJ_DEATH_PLAYERS}
            {OBJ_DEATH_MOR ()}
			{OBJ_TURNS}
			[gold_carryover]
				carryover_percentage=40
				bonus=true
			[/gold_carryover]
		[/objectives]
	[/event]

## Sides

#ifdef MULTIPLAYER
	{LAEKA_SIDE 1 (
		{GOLD 50 40 30}
	)}
	{AOWYN_SIDE 2 (
		{GOLD 50 40 30}
	)}
#else
	{AOWYN_SIDE 1 (
		{GOLD 100 80 60}
	)}
	{LAEKA_SIDE 2 ()}
#endif

	{AI_SIDE "ARDN Kin Laird" "Girvynr" 3 (
		canrecruit=yes
		recruit=ARDN Longarm,ARDN Bannerhand,ARDN Smithy,ARDN Herbalist
		team_name=Girvynr
		allow_player=no
		hidden=yes
        profile=portraits/girvyn.png
		{GOLD 80 120 160}
		{INCOME 3 7 11}
		[unit]
			type=ARDN Strongarm
		[/unit]
		[unit]
			type=ARDN Master Smithy
		[/unit]
		[unit]
			type=ARDN Bannerkeeper
		[/unit]
		[unit]
			type=ARDN Strongarm
		[/unit]
		[unit]
			type=ARDN Bondholder
		[/unit]
	)}

	{AI_SIDE "Walking Corpse" "Corpse" 4 (
		allow_player=no
		hidden=yes
        [ai]
            leader_ignores_keep=yes
            village_value=0
        [/ai]
	)}

	# Corpses will ignore villages
    [event]
        name=prestart
        [modify_ai]
            side=4
            action=delete
            path=stage[main_loop].candidate_action[villages]
        [/modify_ai]
    [/event]

## Singleplayer/multiplayer setup

	[event]
		name=prestart
		[recall]
			id=Laeka
		[/recall]
		[recall]
			id=Mór
		[/recall]
		[recall]
			id=Cánë-ramian
		[/recall]
		{LOYAL_UNIT 3 "ARDN Mounted Strongarm" 28 8}

		# Add the second keep
#ifdef MULTIPLAYER
		[terrain]
			x=3
			y=8
			layer=both
			terrain=Kea
		[/terrain]
		[terrain]
			x=2
			y=8
			layer=both
			terrain=Cea
		[/terrain]
#endif
	[/event]

## Opening scenes

	[story]
		[part]
			{OOO_BIGMAP_BACKGROUND}
			{OOO_BIGMAP}
			{OOO_JOURNEY_04_OLD}
			show_title=no
			story= _ "Once the heat of battle had cooled, we were brought to the chief's hut, set down beside a warm fire and fed. Safe from the winds outside, Mór began to tell the story of the clerics."
		[/part]
		[part]
			{OOO_BIGMAP_BACKGROUND}
			{OOO_BIGMAP}
			{OOO_JOURNEY_04_OLD}
			show_title=no
			story= _ "“The white cloaks started coming to Dál Ardhoen when I was a wee lad. Always they were asking about the Oerbrae, these old stone monuments that lie all about up here. No one knows what they are or why they're here. But these clerics paid well for any shards with a runic inscription. Many of my kin grew rich in silver and steel.”"
		[/part]
		[part]
			{OOO_BIGMAP_BACKGROUND}
			{OOO_BIGMAP}
			{OOO_JOURNEY_04_OLD}
			show_title=no
			story= _ "“Then one day they paid Clan Loairn to take them o'er to Hearthmór, our sacred burial ground in the east. We never saw them again, but we knew they were still about. The clouds over Hearthmór grew thicker every year.”"
		[/part]
		[part]
			{OOO_BIGMAP_BACKGROUND}
			{OOO_BIGMAP}
			{OOO_JOURNEY_04_OLD}
			show_title=no
			story= _ "From time to time, the dead that we left to return to the soil in Hearthmór would wander back to our lands, upright and snarling but dead to the world. And then the horde came! We only had to fight the strays that wandered west, but the land to the south was scoured wherever the returners went.”"
		[/part]
		[part]
			{OOO_BIGMAP_BACKGROUND}
			{OOO_BIGMAP}
			{OOO_JOURNEY_04_OLD}
			show_title=no
			story= _ "“When Nivyan came to us, he told us of the awful fight in the southern lands and it was only then that we understood our part in it. We wanted to leave things alone, but Nivyan insisted on going east. He said it would all happen again if we didn't dig out the roots and poison the well. He could be very persuasive, your father!”"
		[/part]
		[part]
			{OOO_BIGMAP_BACKGROUND}
			{OOO_BIGMAP}
			{OOO_JOURNEY_04_OLD}
			show_title=no
			story= _ "“Some of our clansmen took him east to Hearthmór, travelling in small numbers to stay unseen. Nivyan didn't want the white cloaks to know he was after them. But they never returned, not Nivyan nor any of our clansmen.”"
		[/part]
		[part]
			{OOO_BIGMAP_BACKGROUND}
			{OOO_BIGMAP}
			{OOO_JOURNEY_04_OLD}
			show_title=no
			story= _ "When Mór had finished telling what happened, we agreed together to go to Hearthmór, learn of father's fate, and put an end to the Order. The barrels were tapped. Songs were sung. In the heat of the crowded hut, noisy with drink and laughter, I sat quietly and watched the room. I had never felt more alone."
		[/part]
	[/story]

	{OOO_BIG_MAP_TRACK {OOO_JOURNEY_05_NEW} }

	[event]
		name=start
		[message]
			speaker=Girvynr
			message = _ "Seize them!"
		[/message]
		[message]
			speaker=Mór
			message = _ "What's the meaning of this Girvynr?"
		[/message]
		[message]
			speaker=Girvynr
			message = _ "Step aside Mór! If there's a bounty out on a white cloak then we'll be the ones to collect it."
		[/message]
		[message]
			speaker=Mór
			message = _ "We travel under the protection of Riata's kin. Do ye want to start a feud?"
		[/message]
		[message]
			speaker=Girvynr
			message = _ "Riata's a fool for trusting them and yer a fool for following him!"
		[/message]
		[message]
			speaker=Aowyn
			message = _ "Is there another route?"
		[/message]
		[message]
			speaker=Mór
			message = _ "Only one that would take us further into Girvynr's land. Even if there were another path, we can not let his challenge go unanswered."
		[/message]
		[message]
			speaker=Laeka
			message = _ "He has chosen a tight spot to ambush us!"
		[/message]
		[message]
			speaker=Mór
			message = _ "Girvynr's clan is as strong as an orc and as dumb as one too. Try to lure them into the river where they'll be easier to cut down."
		[/message]
	[/event]

## Events

	{DEATH_PLAYERS}
	{DEATH_MOR (
		[endlevel]
			result=defeat
		[/endlevel]
	)}
	{STARTING_VILLAGES_AREA 3 24 11 6}

    # Walking corpses arrive
    [event]
        name=side 1 turn 7
        {UNIT 4 "Soulless" 30 17 (id=corpse)}
        [message]
            speaker=Aowyn
            message = _ "What... what is that creature?"
        [/message]
        [message]
            speaker=corpse
            message = _ "Ugghh... Mmmhh..."
        [/message]
        [message]
            speaker=Mór
            message = _ "You've not seen a returner before?"
        [/message]
        [message]
            speaker=Aowyn
            message = _ "Is this the living dead?"
        [/message]
        [message]
            speaker=Mór
            message = _ "Oh they are dead alright, but very dangerous. You'll want to keep your heid about you."
        [/message]
        [message]
            speaker=Aowyn
            message = _ "I thought they were nothing but rags and bones?"
        [/message]
        [message]
            speaker=Mór
            message = _ "This one mustn't have lain for long before he was raised."
        [/message]
    [/event]

    [event]
        name=side 1 turn 11
        {UNIT 4 "Walking Corpse" 30 11 ()}
        [message]
            speaker=Laeka
            message = _ "Another one of the dead is coming this way!"
        [/message]
        [scroll_to]
            x=30
            y=8
        [/scroll_to]
		[delay]
			time=2000
		[/delay]
        [message]
            speaker=Mór
            message = _ "They're coming from Hearthmór."
        [/message]
    [/event]

    [event]
        name=side 1 turn 13
        {UNIT 4 "Soulless" 30 17 (id=corpse3)}
        [message]
            speaker=corpse2
            message = _ "Ugghh... Mmmhh..."
        [/message]
        [message]
            speaker=Aowyn
            message = _ "They keep coming!"
        [/message]
        [scroll_to]
            x=30
            y=11
        [/scroll_to]
		[delay]
			time=2000
		[/delay]
        [message]
            speaker=Laeka
            message = _ "Keep your wits, Wyn. They seem to be drifting through in ones and twos."
        [/message]
    [/event]

    [event]
        name=side 1 turn 18
        {UNIT 4 "Walking Corpse" 30 14 ()}
        [message]
            speaker=Laeka
            message = _ "There's another one!"
        [/message]
        [scroll_to]
            x=30
            y=7
        [/scroll_to]
		[delay]
			time=2000
		[/delay]
        [message]
            speaker=Aowyn
            message = _ "They don't seem to be under anyone's control."
        [/message]
    [/event]

	# First walking corpse is killed
	[event]
		name=die
		[filter]
			type=Walking Corpse,Soulless
		[/filter]
		[message]
			speaker=second_unit
			message = _ "All this loose flesh makes me sick. Can't a man be left alone to return to the land once he's away with the dead!"
		[/message]
	[/event]

	# Victory: enemy leader killed
	[event]
		name=last breath
		[filter]
			id=Girvynr
		[/filter]
		[message]
			speaker=Girvynr
			message = _ "My kin will avenge me!"
		[/message]
	[/event]

	[event]
		name=die
		[filter]
			id=Girvynr
		[/filter]
		[message]
			speaker=Aowyn
			message = _ "Our way forward is clear. But have we made more problems for your clan, Mór?"
		[/message]
		[message]
			speaker=Mór
			message = _ "Don't worry yerself over the many feuds of the Pycts. If it weren't you, Girvynr would find another way to cause trouble. We are not far from Hearthmór now."
		[/message]
		[endlevel]
			carryover_percentage=40
			carryover_add=yes
			result=victory
		[/endlevel]
	[/event]

[/scenario]