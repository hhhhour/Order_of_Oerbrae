#define OOO_ACHIEVEMENT_PYCTS_RECRUIT_SETUP
	[event]
		name=start
		[set_variable]
			name=achievement_no_pycts
			value=0
		[/set_variable]
	[/event]
#enddef

#define OOO_ACHIEVEMENT_PYCTS_RECRUIT
	[event]
		name=recruit,recall
		[filter]
			race=pycts
			[not]
				id=Mór
			[/not]
		[/filter]
		[set_variable]
			name=achievement_no_pycts
			value=1
		[/set_variable]
	[/event]
#enddef

#define OOO_ACHIEVEMENT_PYCTS_RECRUIT_COMPLETED
	[if]
		[variable]
			name=achievement_no_pycts
			equals=0
		[/variable]
		[then]
			[set_achievement]
				content_for=OOO_achievements
				id=OOO_achievement_no_pycts
			[/set_achievement]
		[/then]
	[/if]
#enddef
