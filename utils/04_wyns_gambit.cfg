#define OOO_STORE_TOP_RECALLS NUM VARIABLE
	[set_variable]
		name=top_recalls_num
		value={NUM}
	[/set_variable]
	[set_variable]
		name=top_recalls_var
		value={VARIABLE}
	[/set_variable]
	[lua]
		code=<<
			local target_num = tonumber(wml.variables.top_recalls_num) or 5
			local wml_target_varname = wml.variables.top_recalls_var

			local combined_list = {}
			local sides_to_check = {1, 2}

			-- Get all side recalls
			for _, side_num in ipairs(sides_to_check) do
				local recall_units = wesnoth.units.find_on_recall({ side = side_num })
				for _, u in ipairs(recall_units) do
					table.insert(combined_list, {
						unit_obj = u,
						side = side_num
					})
				end
			end

			-- Sort by Level, then Experience (highest first)
			table.sort(combined_list, function(a, b)
				local u_a = a.unit_obj
				local u_b = b.unit_obj

				local level_a = tonumber(u_a.level) or 0
				local level_b = tonumber(u_b.level) or 0
				if level_a ~= level_b then return level_a > level_b end

				local exp_a = tonumber(u_a.experience) or 0
				local exp_b = tonumber(u_b.experience) or 0
				return exp_a > exp_b
			end)

			-- Get first {NUM} in list
			local top_sliced = {}
			local limit = math.min(target_num, #combined_list)
			local units_to_extract = {}

			for i = 1, limit do
				local item = combined_list[i]
				-- Extract the raw WML config data to save to our WML variable array
				table.insert(top_sliced, item.unit_obj.__cfg)
				table.insert(units_to_extract, item.unit_obj)
			end

			-- Make sure the player has at least {NUM} reinforcements
			while #top_sliced < target_num do
				local scrapper = wesnoth.units.create({
					type = "ARDN Scrapper",
					side = 1
				})
				table.insert(top_sliced, scrapper.__cfg)
			end

			-- Save list in array and delete the units from the recall list
			wml.array_access.set(wml_target_varname, top_sliced)
			for _, u in ipairs(units_to_extract) do
				u:extract()
			end
		>>
	[/lua]
	{CLEAR_VARIABLE top_recalls_num,top_recalls_var}
#enddefine

#define OOO_PLACE_HUNTERS ROLE COUNT RANGE UNIT_WML
	[random_placement]
		num_items={COUNT}
		variable=random_loc
		min_distance=1
		[filter_location]
			{RANGE}
			[not]
				[filter]
				[/filter]
			[/not]
		[/filter_location]
		[command]
			[unit]
				{UNIT_WML}
				role={ROLE}
				x=$random_loc.x
				y=$random_loc.y
			[/unit]
		[/command]
	[/random_placement]
	[clear_variable]
		name=random_loc
	[/clear_variable]
	[micro_ai]
		side=3
		ai_type=big_animals
		action=add
		[filter]
			role={ROLE}
		[/filter]
		[filter_location]
			{RANGE}
		[/filter_location]
	[/micro_ai]
#enddefine

#define OOO_SPAWN_BAT TYPE X Y
	[sound]
		name=bat-flapping.wav
	[/sound]
	{UNIT 3 {TYPE} {X} {Y} (animate=yes)}
	[delay]
		time=600
	[/delay]
#enddefine

#define OOO_LIGHT_BRAZIER LOCATION
	[scroll_to]
		{LOCATION}
	[/scroll_to]
	[sound]
		name=fire.wav
	[/sound]
	[terrain]
		{LOCATION}
		terrain=Rb^Ebn
	[/terrain]
	[redraw][/redraw]
	[delay]
		time=600
	[/delay]
#enddefine

#define OOO_IF_FIRE_EXTINGUISHED COUNT ACTIONS
	[if]
		[variable]
			name=fires_lit
			numerical_equals={COUNT}
		[/variable]
		[then]
			{ACTIONS}
		[/then]
	[/if]
#enddefine

#define OOO_UNIT_GOTO_FIRE TYPE SPAWN_X SPAWN_Y GOTO_X GOTO_Y
	{UNIT 4 {TYPE} {SPAWN_X} {SPAWN_Y} (role=fire_{GOTO_X}_{GOTO_Y})}
	[micro_ai]
		side=4
		ai_type=goto
		ca_id=fire_{GOTO_X}_{GOTO_Y}
		action=add
		[filter]
			role=fire_{GOTO_X}_{GOTO_Y}
		[/filter]
		[filter_location]
			x={GOTO_X}
			y={GOTO_Y}
		[/filter_location]
	[/micro_ai]
	[event]
		name=moveto
		first_time_only=yes
		[filter]
			x={GOTO_X}
			y={GOTO_Y}
			role=fire_{GOTO_X}_{GOTO_Y}
		[/filter]
		[micro_ai]
			side=4
			ai_type=goto
			ca_id=fire_{GOTO_X}_{GOTO_Y}
			action=delete
		[/micro_ai]
	[/event]
#enddefine

#define OOO_WYN_ILLUMINATES_AREA X Y
	[time_area]
		id=illuminated_time
		remove=yes
	[/time_area]
	[time_area]
		id=illuminated_time
		x,y={X},{Y}
		radius=3
		[time]
			id=illuminated_night
			name=_"Illuminated"
			image=misc/time-schedules/default/schedule-secondwatch.png~BLIT(misc/tod-bright.png)
			red=10
			green=10
			blue=10
		[/time]
	[/time_area]
	[remove_item]
		id=illuminated_ring
	[/remove_item]
	[item]
		id=illuminated_ring
		x,y={X},{Y}
		halo=halo/illuminates-aura.png
	[/item]
#enddefine

#define OOO_WYN_SLOWED
	[modify_unit]
		[filter]
			id=Aowyn
		[/filter]
		[status]
			slowed=yes
		[/status]
	[/modify_unit]
#enddefine

#define OOO_IF_ILLUMINATED WML_THEN WML_ELSE
	[if]
		[variable]
			name=illuminated
			boolean_equals=yes
		[/variable]
		[then]
			{WML_THEN}
		[/then]
		[else]
			{WML_ELSE}
		[/else]
	[/if]
#enddefine

#define OOO_WYN_ILLUMINATES_EVENTS
	# Events for Wyn's illuminate
	# ----
	# - Large illuminated area around Wyn wherever she moves
	# - Wyn is slowed for the remainder of the scenario
	# - Illuminate stops at dawn
	[event]
		name=wyn_illuminates
		[store_unit]
			[filter]
				id=Aowyn
			[/filter]
			variable=target
		[/store_unit]
		[scroll_to_unit]
			id=Aowyn
		[/scroll_to_unit]
		[message]
			speaker=narrator
			message = _ "Laeka here's a cry and turns to find Aowyn on one knee, her palms flat on the wet earth."
		[/message]
		[sound]
			name=arcane-light.wav
		[/sound]
		[delay]
			time=800
		[/delay]
		[item]
			name=arcane_light
			x,y=$target.x,$target.y
			halo=effects/arcane-light-[1~10].png:80,misc/blank-hex.png:1000
		[/item]
		[redraw][/redraw]
		[delay]
			time=600
		[/delay]
		{FLASH_WHITE (
			[delay]
				time=100
			[/delay]
			[remove_item]
				name=arcane_light
				x,y=$target.x,$target.y
			[/remove_item]
			[redraw][/redraw]
			{OOO_WYN_ILLUMINATES_AREA $target.x $target.y}
			{CLEAR_VARIABLE target}
			[redraw][/redraw]
			[delay]
				time=100
			[/delay]
		)}
		{VARIABLE illuminated yes}
		{OOO_WYN_SLOWED}
		[message]
			speaker=Laeka
			message = _ "Wyn, the light!"
		[/message]
		[message]
			speaker=Aowyn
			message = _ "I don't now how long I can hold on."
		[/message]
		[message]
			speaker=narrator
			image=wesnoth-icon.png
			message = _ "<span style='italic'>Aowyn's illumination will negate the effects of night around her. She will remain slowed as long as she is casting illuminate.</span>"
		[/message]
		[event]
			name=side 1 turn
			first_time_only=no
			{OOO_WYN_SLOWED}
		[/event]
		[event]
			name=moveto
			first_time_only=no
			[filter]
				id=Aowyn
			[/filter]
			[allow_undo][/allow_undo]
			{OOO_IF_ILLUMINATED (
				{OOO_WYN_ILLUMINATES_AREA $unit.x $unit.y}
			) ()}
			[on_undo]
				{OOO_IF_ILLUMINATED (
					{OOO_WYN_ILLUMINATES_AREA $x2 $y2}
				) ()}
			[/on_undo]
		[/event]
	[/event]

	[event]
		name=turn 23
		{CLEAR_VARIABLE illuminated}
		[time_area]
			id=illuminated_time
			remove=yes
		[/time_area]
		[remove_item]
			id=illuminated_ring
		[/remove_item]
	[/event]
#enddef