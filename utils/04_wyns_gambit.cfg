#define OOO_STORE_TOP_RECALLS NUM VARIABLE
	[set_variable]
		name=top_recalls_num
		value={NUM}
	[/set_variable]
	[set_variable]
		name=top_recalls_var
		value={VARIABLE}
	[/set_variable]
	[lua]
		code=<<
			local target_num = tonumber(wml.variables.top_recalls_num) or 5
			local wml_target_varname = wml.variables.top_recalls_var

			local combined_list = {}
			local sides_to_check = {1, 2}

			-- Get all side recalls
			for _, side_num in ipairs(sides_to_check) do
				local recall_units = wesnoth.units.find_on_recall({ side = side_num })
				for _, u in ipairs(recall_units) do
					table.insert(combined_list, {
						unit_obj = u,
						side = side_num
					})
				end
			end

			-- Sort by Level, then Experience (highest first)
			table.sort(combined_list, function(a, b)
				local u_a = a.unit_obj
				local u_b = b.unit_obj

				local level_a = tonumber(u_a.level) or 0
				local level_b = tonumber(u_b.level) or 0
				if level_a ~= level_b then return level_a > level_b end

				local exp_a = tonumber(u_a.experience) or 0
				local exp_b = tonumber(u_b.experience) or 0
				return exp_a > exp_b
			end)

			-- Get first {NUM} in list
			local top_sliced = {}
			local limit = math.min(target_num, #combined_list)
			local units_to_extract = {}

			for i = 1, limit do
				local item = combined_list[i]
				-- Extract the raw WML config data to save to our WML variable array
				table.insert(top_sliced, item.unit_obj.__cfg)
				table.insert(units_to_extract, item.unit_obj)
			end

			-- Save list in array and delete the units from the recall list
			wml.array_access.set(wml_target_varname,  top_sliced)
			for _, u in ipairs(units_to_extract) do
				u:extract()
			end
		>>
	[/lua]
	{CLEAR_VARIABLE top_recalls_num,top_recalls_var}
#enddefine
